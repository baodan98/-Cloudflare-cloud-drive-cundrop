<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · CunDrop</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body">
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="auth-card">
  <div class="logo"><span class="logo-mark">◈</span> CunDrop</div>
  <p class="auth-sub">你的私人云盘 · 基于 Cloudflare R2</p>
  {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
  <form method="post">
    <input type="password" name="password" placeholder="输入访问密码" autofocus required>
    <button type="submit" class="btn primary btn-block">进入</button>
  </form>
</div>
</body>
</html>
